      <stop stop-color="#0d1d31"/>
      <stop offset="1" stop-color="#11102b"/>
    </linearGradient>
    <linearGradient id="accent" x1="10" y1="14" x2="55" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55d7ff"/>
